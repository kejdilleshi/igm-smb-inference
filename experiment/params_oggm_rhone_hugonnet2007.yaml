# @package _global_
#
# SMB inference on Rhonegletscher — HUGONNET-ANCHORED variant, Appendix A2.
# Same DA epoch, same bed, same 2007->2016 window as
# params_oggm_rhone_insitu.yaml (data/input_rhone_insitu.nc); the ONLY
# difference is the source of the 2007 start-of-period surface:
#
#   rhone_insitu       : usurfstart = surveyed swisstopo 2007 DEM
#   rhone_hugonnet2007 : usurfstart = usurf(2016) - hugonnet_dhdt * 9 yr
#                        (Hugonnet et al. 2021 mean 2000-2020 rate; see
#                        data/rhone/build_input_hugonnet2007.py)
#
# DA-relevant fields (usurf/usurfobs=2016, thk, thkobs, velocity, icemask)
# are copied byte-for-byte from input_rhone_insitu.nc, so for a given
# tau_ref the DA state is numerically identical between the two experiments
# -- only the smb_inference forward-run start geometry (and hence the
# inferred SMB) differs. This replaces the earlier, WRONG rhone_da2020
# experiment, which mistakenly anchored on a different (~2006-2020) window
# than the main text and has been deleted (not archived).
#
# Stages (one igm_run, so the SMB inference inherits the DA-retrained emulator):
#   1. data_assimilation — invert thk against velsurf / icemask ONLY on the
#                          2016 surface (velocity-only; NO thickness obs).
#   2. smb_inference     — re-anchor to the Hugonnet-implied 2007 geometry
#                          on the DA bed, forward-run 2007 → 2016, and fit
#                          a 1-D SMB(z) profile (dz=200 m) to match the 2016
#                          surface (usurfinfer − topg = exactly the DA
#                          thickness).

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation
    - smb_inference

inputs:
  local:
    filename: input_rhone_hugonnet2007.nc
    crop:
      xmin: -3053.0
      xmax: 2907.0
      ymin: 5157422.0
      ymax: 5167672.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.130
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false

  data_assimilation:
    control_list:
      - thk
    cost_list:
      - velsurf
      - icemask
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
      thkobs_std: 4.1
    regularization:
      thk: 537.0
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius

  smb_inference:
    t_start: 2007.0
    ttot: 2016.0
    dtmax: 1.0
    cfl: 0.2
    emulator:
      from_state: true
    # DA was done on the 2016 surface -> rewind the geometry to the
    # Hugonnet-implied 2007 surface on the DA-fixed bed before integrating
    # forward. This is the ONLY functional difference from
    # params_oggm_rhone_insitu.yaml.
    initial_state:
      usurf_variable: usurfstart
    observations:
      state_variable: usurfinfer
      smb_points_file: ${hydra:runtime.cwd}/data/rhone/SMB_rhone_2007-2016_rawstakes_utm32N.csv
    inversion:
      method: profile
      dz: 200.0
      smb_init_low: -1.0
      smb_init_high: 1.0
    optimization:
      optimizer: lbfgs
      nbitmax: 50
      learning_rate: 0.1
      regularisation: 0.01
      early_stop_patience: 7
      early_stop_threshold: 0.01
      retrain_emulator_freq: 50000
      early_retrain_iters: 1
      lbfgs_memory: 10
      lbfgs_tolerance: 1.0e-6
      lbfgs_x_tolerance: 0.0
      lbfgs_f_relative_tolerance: 1.0e-5

    output:
      vis_freq: 5.0
      visualize: false
      outdir: ./smb_inference
      plot_loss: true
      save_results: true
