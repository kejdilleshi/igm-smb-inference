# @package _global_
#
# OGGM-paired SMB inference on Grosser Aletschgletscher (RGI60-11.01450).
# Inputs were built end-to-end from OGGM + COP-DEM:
#   data/oggm/fetch_oggm.py           — pull OGGM L3 prepro + Hugonnet + Millan22 + GlaThiDa
#   data/oggm/fetch_copdem.py         — pull Copernicus DEM 30 (~2020) onto gdir grid (AWS S3)
#   data/oggm/build_input_nc.py       — assemble data/input_RGI60_11.01450.nc with
#                                       usurfinfer = COP-DEM 30 (≈2020 anchor),
#                                       usurfobs   = usurfinfer − Hugonnet dhdt × 20 (≈2000)
#   data/oggm/build_glamos_stakes.py  — synthesize stake CSV from GLAMOS B36-26 2000-2020
#                                       for diagnostic profile overlay only (NOT used in cost)
#
# Pipeline (same as params_argentiere.yaml):
#   1. data_assimilation — invert thk + slidingco against velsurf / icemask / thk(GlaThiDa)
#   2. smb_inference     — forward-run 2000 → 2020, fit a 1-D SMB(z) profile (dz=200 m)
#                          to match the COP-DEM 30 (~2020) surface
#
# Grid: OGGM local TMerc (lon_0=8.01919°, lat_0=0°), dx=137 m, 247×294 native,
# cropped to 93×141 below.

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation
    - smb_inference

inputs:
  local:
    filename: input_RGI60_11.01450.nc
    crop:
      xmin: -7170.0
      xmax: 5611.0
      ymin: 5137710.0
      ymax: 5157068.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.154
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false

  data_assimilation:
    control_list:
      - thk
      # - slidingco
    cost_list:
      - velsurf
      - icemask
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
      thkobs_std: 16.0
    regularization:
      thk: 328.0
      # slidingco: 2.0
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
      # slidingco: 0.024970737145052723
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius

  smb_inference:
    t_start: 2000.0
    ttot: 2020.0
    dtmax: 1.0
    cfl: 0.2
    emulator:
      from_state: true
    observations:
      state_variable: usurfinfer
      smb_points_file: ${hydra:runtime.cwd}/data/aletsch/SMB_aletsch_2000-2020_rawstakes_utm32N.csv
    inversion:
      method: profile
      dz: 200.0
      smb_init_low: -10.0
      smb_init_high: 1.0
      # init_from_obs: true
    optimization:
      optimizer: lbfgs
      nbitmax: 50
      learning_rate: 0.1
      regularisation: 0.05
      early_stop_patience: 3
      early_stop_threshold: 0.01
      retrain_emulator_freq: 50000
      early_retrain_iters: 1
      lbfgs_memory: 10
      lbfgs_tolerance: 1.0e-6
      lbfgs_x_tolerance: 0.0
      lbfgs_f_relative_tolerance: 0.0

    output:
      vis_freq: 5.0
      visualize: false
      outdir: ./smb_inference
      plot_loss: true
      save_results: true

