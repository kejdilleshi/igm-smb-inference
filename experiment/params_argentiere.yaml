# @package _global_
#
# SMB inference only on Aletsch Glacier.
# Inverts for a 1D elevation-dependent SMB profile using pre-existing
# DA-optimized thickness and retrained FNO2 emulator from state.
# Requires a prior DA run to have populated the state.
#

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation
    - smb_inference

inputs:
  local:
    filename: input_argentiere.nc
    crop:
      xmin: 340310.0
      xmax: 349366.0
      ymin: 5085870.0
      ymax: 5094774.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.45 # <----- ensure this is the same as the value used in the input file since here we are not trying to invert for tau_ref but only for thk
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 1
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false


  data_assimilation:
    control_list:
      - thk
    cost_list:
      - velsurf
      - icemask
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
    regularization:
      thk: 10.0
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1

  smb_inference:
    t_start: 2012.0
    ttot: 2021.0
    dtmax: 1.0
    cfl: 0.2
    emulator:
      from_state: true
    observations:
      state_variable: usurfinfer
      smb_points_file: ${hydra:runtime.cwd}/data/argentiere/SMB_argentiere_2012-2021_utm32N.csv
    inversion:
      method: profile
      dz: 200.0
      smb_init_low: -10.0
      smb_init_high: 1.0
    optimization:
      # optimizer: 'adam' or 'lbfgs'
      optimizer: lbfgs
      nbitmax: 50
      learning_rate: 0.1          # Adam only
      regularisation: 0.1
      early_stop_patience: -1
      early_stop_threshold: 0.001
      retrain_emulator_freq: 50000
      early_retrain_iters: 1
      # L-BFGS options (ignored when optimizer=adam)
      lbfgs_memory: 10
      lbfgs_tolerance: 1.0e-6
      lbfgs_x_tolerance: 0.0
      lbfgs_f_relative_tolerance: 0.0


    output:
      vis_freq: 5.0
      visualize: false
      outdir: ./smb_inference
      plot_loss: true
      save_results: true


