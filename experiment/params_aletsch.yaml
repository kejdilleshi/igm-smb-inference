# @package _global_
#
# SMB inference on Grosser Aletschgletscher (Switzerland).
# Period: 2009 → 2017 (stand-in; will be re-targeted to 2009 → 2023 once a
# 2023 DEM is staged into input_aletsch.nc as `usurfinfer`).
#
# Stages:
#   1. data_assimilation  — invert thk + slidingco against velsurf / icemask
#                           / thkobs (GPR), using the pretrained SIADecompNet
#                           iceflow emulator already used for Argentière.
#   2. smb_inference      — forward-run from t_start to ttot, fit a 1-D SMB(z)
#                           profile (dz=200 m) to match usurfinfer + GLAMOS
#                           elevation-band stakes.
#
# DA hyperparameters below are inherited from the Argentière sweep and should
# be re-tuned for Aletsch (optuna_sweep_da*.py). Treat the first run as a
# sanity check, not a final inversion.

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation
    - smb_inference

inputs:
  local:
    filename: input_aletsch.nc
    crop:
      xmin: 417650.0
      xmax: 430450.0
      ymin: 5138650.0
      ymax: 5157550.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.46171837516132724
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false


  data_assimilation:
    control_list:
      - thk
      - slidingco
    cost_list:
      - velsurf
      - icemask
      - thk
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
      thkobs_std: 11.964981600016369
    regularization:
      thk: 328.17251227955273
      slidingco: 10491954.33226791
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
      slidingco: 0.023270677083837805
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius

  smb_inference:
    t_start: 2009.0
    ttot: 2017.0
    dtmax: 1.0
    cfl: 0.2
    emulator:
      from_state: true
    observations:
      state_variable: usurfinfer
      smb_points_file: ${hydra:runtime.cwd}/data/aletsch/SMB_aletsch_2009-2017_utm32N.csv
    inversion:
      method: profile
      dz: 200.0
      smb_init_low: -10.0
      smb_init_high: 1.0
    optimization:
      optimizer: lbfgs
      nbitmax: 100
      learning_rate: 0.1
      regularisation: 0.05
      early_stop_patience: -1
      early_stop_threshold: 0.001
      retrain_emulator_freq: 50000
      early_retrain_iters: 1
      lbfgs_memory: 10
      lbfgs_tolerance: 1.0e-6
      lbfgs_x_tolerance: 0.0
      lbfgs_f_relative_tolerance: 0.0

    output:
      vis_freq: 5.0
      visualize: false
      outdir: ./smb_inference
      plot_loss: true
      save_results: true
