# @package _global_
#
# OGGM-paired SMB inference on Rhonegletscher (RGI60-11.01238).
# Mirrors params_oggm_aletsch.yaml. Inputs were built end-to-end from OGGM + COP-DEM:
#   data/oggm/fetch_oggm.py    RGI60-11.01238  — L3 prepro + Hugonnet + Millan22 + GlaThiDa
#   data/oggm/fetch_copdem.py  RGI60-11.01238  — Copernicus DEM 30 (~2020) onto gdir grid (AWS S3)
#   data/oggm/build_input_nc.py RGI60-11.01238 --n-years 14
#                                              — assemble data/input_RGI60_11.01238.nc with
#                                                usurfinfer = COP-DEM 30 (≈2020 anchor),
#                                                usurfobs   = usurfinfer − Hugonnet dhdt × 14 (≈2006)
#   data/rhone/build_raw_stakes_csv.py --start 2006 --end 2020
#                                              — raw GLAMOS stake CSV (2006-2020) for the
#                                                Kneib-2024-style validation overlay (NOT in cost)
#
# Why 2006-2020: the Rhone GLAMOS stake network starts in 2006. Matching the
# inversion window to the stake window gives a like-for-like comparison
# (multi-year mean profile vs per-stake multi-year mean).
#
# Pipeline:
#   1. data_assimilation — invert thk + slidingco against velsurf / icemask / thk(GlaThiDa)
#   2. smb_inference     — forward-run 2006 → 2020, fit a 1-D SMB(z) profile (dz=200 m)
#                          to match the COP-DEM 30 (~2020) surface
#
# Grid: OGGM local TMerc (lon_0=8.3965°, lat_0=0°), dx=66 m, 220×285 native,
# cropped to ~78×144 below (1 km padding around the icemask).
#
# NOTE on the emulator: pretrained_path still points at the Aletsch-trained
# SIADecompNet. The architecture is generic and DA retrains the weights, so
# this works as a warm start, but expect early DA iterations to drift.

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation
    - smb_inference

inputs:
  local:
    filename: input_RGI60_11.01238.nc
    crop:
      xmin: -3053.0
      xmax: 2907.0
      ymin: 5157422.0
      ymax: 5167672.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.130
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false

  data_assimilation:
    control_list:
      - thk
    cost_list:
      - velsurf
      - icemask
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
      thkobs_std: 4.1
    regularization:
      thk: 537.0
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius

  smb_inference:
    t_start: 2006.0
    ttot: 2020.0
    dtmax: 1.0
    cfl: 0.2
    emulator:
      from_state: true
    observations:
      state_variable: usurfinfer
      smb_points_file: ${hydra:runtime.cwd}/data/rhone/SMB_rhone_2006-2020_rawstakes_utm32N.csv
    inversion:
      method: profile
      dz: 200.0
      smb_init_low: -10.0
      smb_init_high: 1.0
      # init_from_obs: true
    optimization:
      optimizer: lbfgs
      nbitmax: 50
      learning_rate: 0.1
      regularisation: 0.01
      early_stop_patience: 3
      early_stop_threshold: 0.01
      retrain_emulator_freq: 50000
      early_retrain_iters: 1
      lbfgs_memory: 10
      lbfgs_tolerance: 1.0e-6
      lbfgs_x_tolerance: 0.0
      lbfgs_f_relative_tolerance: 0.0

    output:
      vis_freq: 5.0
      visualize: false
      outdir: ./smb_inference
      plot_loss: true
      save_results: true
