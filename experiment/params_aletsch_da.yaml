# @package _global_
#
# DA-only stage for Grosser Aletschgletscher (Switzerland), 2009 → 2017,
# driven by swisstopo-derived DEMs from igm-examples/aletsch/data/past_surf.nc.
#
# This file is the sweep target for optuna_sweep_da_nsga.py — it mirrors the
# DA stage of params_aletsch.yaml exactly, but omits the smb_inference stage
# so the sweep optimises DA cost terms only.
#
# Control list: thk only. slidingco is held fixed at init_slidingco everywhere
# on the glacier and never updated (matches the choice in params_aletsch.yaml).

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
    - data_assimilation

inputs:
  local:
    filename: input_aletsch.nc
    crop:
      xmin: 417650.0
      xmax: 430450.0
      ymin: 5138650.0
      ymax: 5157550.0

processes:
  iceflow:
    physics:
      init_slidingco: 0.46171837516132724
      sliding:
        weertman:
          u_ref: 100.0
    emulator:
      network:
        architecture: SIADecompNet
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      inputs: [thk, usurf, slidingco, arrhenius, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "/home/klleshi/Documents/igm-examples/aletsch/SIADecompNet_18x80_dil1-32/"
        pretrained: true
        print_summary: true
        old_format: false

  data_assimilation:
    control_list:
      - thk
      # - slidingco
    cost_list:
      - velsurf
      - icemask
      - thk
    optimization:
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      velsurfobs_std: 2.1
      thkobs_std: 11.964981600016369
    regularization:
      thk: 328.17251227955273
      # slidingco: 10491954.33226791
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
      # slidingco: 0.023270677083837805
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius
